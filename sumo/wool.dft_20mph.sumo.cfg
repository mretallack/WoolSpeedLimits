<configuration>
    <input>
        <net-file value="wool.20mph.net.xml"/>
        <route-files value="wool.rou.dft_controlled.v2.xml"/>
	<gui-settings-file value="wool.settings.xml"/>
	<additional-files value="wool.additional-6-9-2016.xml,wool.stats.dft_20mph.additional.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="3600"/>
    </time>
    <report>
        <no-step-log value="true"/>
        <tripinfo-output value="wool.dft_20mph.tripinfo.xml"/>
        <statistic-output value="wool.dft_20mph.statistic.xml"/>
        <!-- Vehicle-level emissions; road-level emissions via wool.stats.dft_20mph.additional.xml edgeData. -->
        <emission-output value="wool.dft_20mph.emissions.xml"/>
    </report>
    <time-to-teleport value="1000"/>
    <!-- Fixed seed for reproducibility: any re-run yields identical results. -->
    <random_number>
        <seed value="42"/>
    </random_number>
</configuration>
