<configuration>
    <input>
        <net-file value="wool.net.xml"/>
        <route-files value="wool.rou.dft_offpeak.v2.xml"/>
        <gui-settings-file value="wool.settings.xml"/>
        <additional-files value="wool.additional-6-9-2016.xml,wool.stats.dft_offpeak_now.additional.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="3600"/>
    </time>
    <report>
        <no-step-log value="true"/>
    </report>
    <tripinfo-output value="wool.dft_offpeak_now.tripinfo.xml"/>
    <statistic-output value="wool.dft_offpeak_now.statistic.xml"/>
    <!-- Vehicle-level emissions (per-timestep, summed per trip by analyze_emissions.py).
         Road-level emissions are produced separately via wool.stats.dft_offpeak_now.additional.xml edgeData. -->
    <emission-output value="wool.dft_offpeak_now.emissions.xml"/>
    <time-to-teleport value="1000"/>
    <!-- Fixed seed for reproducibility: any re-run yields identical results. -->
    <random_number>
        <seed value="42"/>
    </random_number>
</configuration>